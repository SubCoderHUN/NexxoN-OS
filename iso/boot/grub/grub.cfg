# ============================================================================
# NexxoN OS - GRUB Boot Menu Configuration
# ----------------------------------------------------------------------------
# Loaded by GRUB 2 at boot.  Sets the screen mode hint (1024x768x32) and hands
# control to our Multiboot v1 compliant kernel ELF.
#
# The `module` line passes a SECOND copy of the kernel image as a multiboot
# module.  The running kernel reads those bytes back out of memory via
# mbi->mods_addr and feeds them to installsys, which writes them to LBA 64+
# of the SATA disk so the HDD can boot stand-alone (no CD/USB needed).
#
# The token(s) after the kernel path become the kernel command line
# (mbi->cmdline).  The kernel honours:
#     bootpause    - hold the boot log on screen for ~30 s (skippable) so it
#                    can be read even when the monitor re-syncs slowly.
#     nousbnative  - do NOT auto-take the USB stack over from BIOS SMM at boot
#                    (escape hatch: keeps the proven SMM keyboard path).
#     forcetramp   - pretend the BGA (QEMU/Bochs) adapter is absent so the
#                    REAL bare-metal VBE trampoline path runs in QEMU too
#                    (diagnostics: resolution switch, firmware mode enum).
# ============================================================================

# A visible timeout: on a fast box the menu otherwise flashes past before the
# monitor has re-synced.  `menu` style forces the list to be shown; press Enter
# to boot the highlighted entry immediately, or pick another with the arrows.
set timeout=10
set timeout_style=menu
set default=0

# Hint to GRUB that we want a graphics-capable mode (1024x768x32).
set gfxmode=1024x768x32
set gfxpayload=keep

# Load the necessary modules so VBE can be initialised.
insmod all_video
insmod gfxterm
insmod vbe
insmod vga

menuentry "NexxoN OS (1024x768x32)" {
    echo "[BOOT] GRUB :: loading NexxoN OS kernel ..."
    multiboot /boot/nexxon.elf
    module   /boot/nexxon.payload nexxon-kernel-payload
    boot
}

menuentry "NexxoN OS - verbose boot (hold the boot log on screen)" {
    echo "[BOOT] GRUB :: loading NexxoN OS kernel (verbose) ..."
    multiboot /boot/nexxon.elf bootpause
    module   /boot/nexxon.payload nexxon-kernel-payload
    boot
}

menuentry "NexxoN OS - safe mode (no USB takeover)" {
    echo "[BOOT] GRUB :: loading NexxoN OS kernel (safe mode, no USB takeover) ..."
    multiboot /boot/nexxon.elf nousbnative bootpause
    module   /boot/nexxon.payload nexxon-kernel-payload
    boot
}

menuentry "NexxoN OS - safe text mode (no USB takeover, text video)" {
    set gfxpayload=text
    echo "[BOOT] GRUB :: loading NexxoN OS kernel (safe text mode) ..."
    multiboot /boot/nexxon.elf nousbnative bootpause
    module   /boot/nexxon.payload nexxon-kernel-payload
    boot
}
